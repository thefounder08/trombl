name: trombl
description: trom — your chaotic bestie for deciding what to do.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  go_router: ^14.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  supabase_flutter: ^2.5.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  firebase_messaging: ^16.2.2
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  package_info_plus: ^9.0.1
  shared_preferences: ^2.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    # DM Sans — variable font, declare each weight used so Flutter maps
    # FontWeight.wXXX → the correct axis position in the variable font.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
          weight: 400
        - asset: assets/fonts/DMSans.ttf
          weight: 500
        - asset: assets/fonts/DMSans.ttf
          weight: 600
        - asset: assets/fonts/DMSans.ttf
          weight: 700
        - asset: assets/fonts/DMSans.ttf
          weight: 800

    # Fraunces — variable serif, used for headlines at 700 only.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
          weight: 700
