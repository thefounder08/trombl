name: trombl
description: trom — your chaotic bestie for deciding what to do.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  supabase_flutter: ^2.5.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  firebase_messaging: ^16.2.2
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  package_info_plus: ^9.0.1
  shared_preferences: ^2.3.0
  http: ^1.2.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4

# device_info_plus >=12.0.0 references NSProcessInfo.isiOSAppOnVision, which
# only exists in the iOS 26 SDK. Pin to the last version compiled against
# older SDKs until Xcode here is upgraded past 16.2. share_plus and
# package_info_plus above are pinned to versions using win32 ^5.x so the
# whole graph resolves to one win32 major version without an override
# (forcing win32 down via override previously broke package_info_plus's
# Windows FFI code, which still gets compiled on every dart:io platform).
dependency_overrides:
  device_info_plus: ^11.4.0

flutter_launcher_icons:
  image_path: "assets/icon/app_icon_source.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_source.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon_source.png"
    background_color: "#FFFFFF"
    theme_color: "#090909"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    # DM Sans — variable font, declare each weight used so Flutter maps
    # FontWeight.wXXX → the correct axis position in the variable font.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
          weight: 400
        - asset: assets/fonts/DMSans.ttf
          weight: 500
        - asset: assets/fonts/DMSans.ttf
          weight: 600
        - asset: assets/fonts/DMSans.ttf
          weight: 700
        - asset: assets/fonts/DMSans.ttf
          weight: 800

    # Fraunces — variable serif, used for headlines at 700 only.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
          weight: 700
