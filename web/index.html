<!DOCTYPE html>
<html>
<head>
  <!--
    base href is replaced at build time by --base-href flag.
    For root hosting (Netlify/Vercel) this stays as "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="trom — ur chaotic bestie for deciding what to do.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="trombl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android PWA -->
  <meta name="theme-color" content="#090909">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>trombl</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Black background while Flutter initialises — prevents white flash */
    body { background-color: #090909; margin: 0; }
  </style>
</head>
<body>
  <!--
    Required by passkeys_web — a transitive dep pulled in via supabase_flutter's
    optional WebAuthn support. Its plugin registration checks for
    window.PasskeyAuthenticator at Flutter web bootstrap and calls
    window.close() if it's missing, even though this app doesn't use passkeys.
    Must load synchronously, before flutter_bootstrap.js, so it's defined by
    the time plugin registration runs.
  -->
  <script src="passkeys-bundle.js"></script>

  <!--
    flutter_bootstrap.js is generated by flutter build web.
    CanvasKit renderer is selected via --web-renderer canvaskit flag for
    crisp text rendering that matches native. See netlify.toml build command.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
