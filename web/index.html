<!DOCTYPE html>
<html>
<head>
  <!--
    base href is replaced at build time by --base-href flag.
    For root hosting (Netlify/Vercel) this stays as "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="trom — ur chaotic bestie for deciding what to do.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="trombl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android PWA -->
  <meta name="theme-color" content="#090909">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>trombl</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Black background while Flutter initialises — prevents white flash */
    body { background-color: #090909; margin: 0; }
  </style>
</head>
<body>
  <!--
    flutter_bootstrap.js is generated by flutter build web.
    CanvasKit renderer is selected via --web-renderer canvaskit flag for
    crisp text rendering that matches native. See netlify.toml build command.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
